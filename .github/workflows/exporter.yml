name: "Export Tutorials"

on:
  workflow_dispatch:
    inputs:
      pina_ref:
        description: "PINA ref to run the tutorials against (branch, tag or SHA)"
        required: false
        default: "master"
  push:
    branches:
      - "main"
    paths:
      - 'tutorial*/tutorial.ipynb'
  schedule:
    # Weekly full export to catch regressions in PINA: Mondays at 03:30 UTC.
    - cron: '30 3 * * 1'

concurrency:
  group: export-tutorials-${{ github.ref }}
  cancel-in-progress: false

env:
  PINA_REPO: PINA-org/PINA

jobs:
  # run on push
  export_tutorials_on_push:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      TUTORIAL_TIMEOUT: 1200s
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade pip
        python3 -m pip install ".[tutorial,exporter]" \
          "pina-mathlab[tutorial] @ git+https://github.com/$PINA_REPO@master"

    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v2

    - id: files
      uses: jitterbit/get-changed-files@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        format: space-delimited

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run formatter
      run: black tutorial*/

    - name: Export tutorials to .py and .html
      env:
        FILES: ${{ steps.files.outputs.all }}
      run: |
        set -euo pipefail
        for file in $FILES; do
          if [[ "$file" == tutorial*/tutorial.ipynb ]]; then
            filename=$(basename "$file")
            pyfilename="${filename%.ipynb}.py"
            htmlfilename="${filename%.ipynb}.html"
            dir=$(dirname "$file")
            htmldir="docs/source/tutorials/$dir"
            if [ ! -f "$file" ]; then
              rm -rf "$htmldir"
              continue
            fi
            timeout --signal=SIGKILL "$TUTORIAL_TIMEOUT" \
              python3 -Xfrozen_modules=off -m jupyter nbconvert "$file" \
              --to python --output "$pyfilename" --output-dir "$dir"
            timeout --signal=SIGKILL "$TUTORIAL_TIMEOUT" \
              python3 -Xfrozen_modules=off -m jupyter nbconvert "$file" \
              --execute --to html --output "$htmlfilename" --output-dir "$htmldir"
          fi
        done

    - uses: benjlevesque/short-sha@v2.1
      id: short-sha

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        labels: maintenance
        title: "Export tutorial changed in ${{ steps.short-sha.outputs.sha }}"
        branch: export-tutorial-${{ steps.short-sha.outputs.sha }}
        base: ${{ github.ref_name }}
        commit-message: "export tutorials changed in ${{ steps.short-sha.outputs.sha }}"
        delete-branch: true
        add-paths: |
          tutorial*/
          docs/source/tutorials/

  # run on workflow_dispatch or the weekly schedule
  export_tutorials_workflow_dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      TUTORIAL_TIMEOUT: 1200s
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      env:
        PINA_REF: ${{ inputs.pina_ref || 'master' }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade pip
        python3 -m pip install ".[tutorial,exporter]" \
          "pina-mathlab[tutorial] @ git+https://github.com/$PINA_REPO@$PINA_REF"

    - name: Setup FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v2

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run formatter
      run: black tutorial*/

    - name: Export all tutorials to .py and .html
      run: |
        set -euo pipefail
        for file in $(find tutorial* -type f -name tutorial.ipynb | sort); do
          filename=$(basename "$file")
          pyfilename="${filename%.ipynb}.py"
          htmlfilename="${filename%.ipynb}.html"
          dir=$(dirname "$file")
          htmldir="docs/source/tutorials/$dir"
          timeout --signal=SIGKILL "$TUTORIAL_TIMEOUT" \
            python3 -Xfrozen_modules=off -m jupyter nbconvert "$file" \
            --to python --output "$pyfilename" --output-dir "$dir"
          timeout --signal=SIGKILL "$TUTORIAL_TIMEOUT" \
            python3 -Xfrozen_modules=off -m jupyter nbconvert "$file" \
            --execute --to html --output "$htmlfilename" --output-dir "$htmldir"
        done

    - uses: benjlevesque/short-sha@v2.1
      id: short-sha

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        labels: maintenance
        title: "Export tutorial changed in ${{ steps.short-sha.outputs.sha }}"
        branch: export-tutorial-${{ steps.short-sha.outputs.sha }}
        base: ${{ github.ref_name }}
        commit-message: "export tutorials changed in ${{ steps.short-sha.outputs.sha }}"
        delete-branch: true
        add-paths: |
          tutorial*/
          docs/source/tutorials/
